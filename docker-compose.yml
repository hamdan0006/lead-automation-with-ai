name: lead-automation

services:
  db:
    image: postgres:15
    container_name: lead_db
    restart: always
    networks:
      - lead_net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: leadsdb
    volumes:
      - lead_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lead_redis
    restart: always
    networks:
      - lead_net
    volumes:
      - lead_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: lead_backend
    restart: always
    networks:
      - lead_net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node index.js"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    shm_size: '256m'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@lead_db:5432/leadsdb?schema=public
      REDIS_URL: redis://lead_redis:6379
      JWT_SECRET: ${JWT_SECRET}
      App_Pass: ${App_Pass}
      SMTP_EMAIL: ${SMTP_EMAIL}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL}
      OPENAI_KEY: ${OPENAI_KEY}
      Llama_KEY: ${Llama_KEY}
      Nvidia_super3: ${Nvidia_super3}
      REOON_API_KEY1: ${REOON_API_KEY1}
      REOON_API_KEY2: ${REOON_API_KEY2}
      REOON_API_KEY3: ${REOON_API_KEY3}
      SERPSTACK_API_KEY1: ${SERPSTACK_API_KEY1}
      SERPSTACK_API_KEY2: ${SERPSTACK_API_KEY2}
      SERPSTACK_API_KEY3: ${SERPSTACK_API_KEY3}
      SERPSTACK_API_KEY4: ${SERPSTACK_API_KEY4}
      SERPSTACK_API_KEY5: ${SERPSTACK_API_KEY5}
      SERPSTACK_API_KEY6: ${SERPSTACK_API_KEY6}
      SERPSTACK_API_KEY7: ${SERPSTACK_API_KEY7}
      SERPSTACK_API_KEY8: ${SERPSTACK_API_KEY8}
      SERPSTACK_API_KEY9: ${SERPSTACK_API_KEY9}
      SERPSTACK_API_KEY10: ${SERPSTACK_API_KEY10}
      SERPSTACK_API_URL: ${SERPSTACK_API_URL:-https://api.serpstack.com/search}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: lead_frontend
    restart: always
    networks:
      - lead_net
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  lead_net:
    name: lead_net
    driver: bridge

volumes:
  lead_db_data:
  lead_redis_data:
