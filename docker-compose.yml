services:
  db:
    image: postgres:15
    container_name: leads_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: leadsdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: leads_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: leads_backend
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    environment:
      # Inject DATABASE_URL and REDIS_URL dynamically
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/leadsdb?schema=public
      REDIS_URL: redis://redis:6379
      # Other variables should be provided in a .env file or environment
      JWT_SECRET: ${JWT_SECRET:-change_me_to_something_strong}
      App_Pass: ${App_Pass}
      SMTP_EMAIL: ${SMTP_EMAIL}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL}
      OPENAI_KEY: ${OPENAI_KEY}
      Llama_KEY: ${Llama_KEY}
      Nvidia_super3: ${Nvidia_super3}
      SERPSTACK_API_KEY1: ${SERPSTACK_API_KEY1}
      SERPSTACK_API_KEY2: ${SERPSTACK_API_KEY2}
      SERPSTACK_API_KEY3: ${SERPSTACK_API_KEY3}
      SERPSTACK_API_URL: ${SERPSTACK_API_URL:-https://api.serpstack.com/search}

volumes:
  db_data:
  redis_data:
