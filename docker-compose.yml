name: lead-automation

services:
  db:
    image: postgres:15
    container_name: lead_db
    restart: always
    networks:
      - lead_net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: leadsdb
    volumes:
      - lead_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lead_redis
    restart: always
    networks:
      - lead_net
    volumes:
      - lead_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: lead_backend
    restart: always
    networks:
      - lead_net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node index.js"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    shm_size: '256m'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@lead_db:5432/leadsdb?schema=public
      REDIS_URL: redis://lead_redis:6379

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: lead_frontend
    restart: always
    networks:
      - lead_net
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  lead_net:
    name: lead_net
    driver: bridge

volumes:
  lead_db_data:
  lead_redis_data:
