name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure the repository is present
            if [ ! -d "LeadGenAutomation" ] || [ ! -d "LeadGenAutomation/.git" ]; then
              rm -rf ~/LeadGenAutomation
              git clone https://github.com/hamdan0006/lead-automation-with-ai.git ~/LeadGenAutomation
            fi
            cd ~/LeadGenAutomation
            
            # Update code
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            # Create/Update .env file on the server using secrets
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@db:5432/leadsdb?schema=public" > .env
            echo "REDIS_URL=redis://redis:6379" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "App_Pass=${{ secrets.APP_PASS }}" >> .env
            echo "SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}" >> .env
            echo "NOTIFICATION_EMAIL=${{ secrets.NOTIFICATION_EMAIL }}" >> .env
            echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
            echo "Llama_KEY=${{ secrets.LLAMA_KEY }}" >> .env
            echo "Nvidia_super3=${{ secrets.NVIDIA_SUPER3 }}" >> .env
            echo "REOON_API_KEY1=${{ secrets.REOON_API_KEY1 }}" >> .env
            echo "REOON_API_KEY2=${{ secrets.REOON_API_KEY2 }}" >> .env
            echo "REOON_API_KEY3=${{ secrets.REOON_API_KEY3 }}" >> .env
            echo "SERPSTACK_API_KEY1=${{ secrets.SERPSTACK_API_KEY1 }}" >> .env
            echo "SERPSTACK_API_KEY2=${{ secrets.SERPSTACK_API_KEY2 }}" >> .env
            echo "SERPSTACK_API_KEY3=${{ secrets.SERPSTACK_API_KEY3 }}" >> .env
            echo "SERPSTACK_API_KEY4=${{ secrets.SERPSTACK_API_KEY4 }}" >> .env
            echo "SERPSTACK_API_KEY5=${{ secrets.SERPSTACK_API_KEY5 }}" >> .env
            echo "SERPSTACK_API_KEY6=${{ secrets.SERPSTACK_API_KEY6 }}" >> .env
            echo "SERPSTACK_API_KEY7=${{ secrets.SERPSTACK_API_KEY7 }}" >> .env
            echo "SERPSTACK_API_KEY8=${{ secrets.SERPSTACK_API_KEY8 }}" >> .env
            echo "SERPSTACK_API_KEY9=${{ secrets.SERPSTACK_API_KEY9 }}" >> .env
            echo "SERPSTACK_API_KEY10=${{ secrets.SERPSTACK_API_KEY10 }}" >> .env
            echo "SERPSTACK_API_URL=${{ secrets.SERPSTACK_API_URL }}" >> .env

            # Restart services
            docker-compose down --remove-orphans
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker-compose up -d --build

            # Run Prisma Migrations
            docker-compose exec -T backend npx prisma migrate deploy

            # Cleanup
            docker image prune -f
