name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to repo
            cd ~/LeadGenAutomation || git clone https://github.com/${{ github.repository }} ~/LeadGenAutomation
            cd ~/LeadGenAutomation
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Create/Update .env file on the server using secrets
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@db:5432/leadsdb?schema=public" > .env
            echo "REDIS_URL=redis://redis:6379" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
            echo "SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}" >> .env
            echo "App_Pass=${{ secrets.App_Pass }}" >> .env
            # Add any other required variables here...

            # Restart services
            docker-compose down
            docker-compose up -d --build

            # Run Prisma Migrations
            docker-compose exec -T backend npx prisma migrate deploy

            # Cleanup
            docker image prune -f
